services:
  - type: web
    name: my-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "7224850261"
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH
        sync: false
      - key: FIREBASE_NAMESPACE
        value: "s_9932bb6448a6a00d22e48c17"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_PATH
        value: "telegram-webhook"
